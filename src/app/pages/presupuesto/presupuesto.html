<h2>Presupuesto asignado vs consumido</h2>

<ph-section-nav [links]="navLinks" ariaLabel="Secciones de reportes" />

<div class="acciones-reporte">
  <button type="button" mat-button class="boton" (click)="exportarCsv()">Exportar CSV</button>
  <button type="button" mat-button class="boton" (click)="exportarPdf()">Exportar PDF</button>
</div>

<ph-data-table
  [filas]="filasConEstilo()"
  [pie]="filaTotal()"
  textoVacio="Sin proyectos para reportar."
>
  <ph-data-table-column name="nombre" header="Proyecto" />
  <ph-data-table-column name="asignado" header="Asignado" align="right">
    <ng-template #cell let-fila>
      <span [class.negativa]="fila['excedido']">{{ intl.monto(fila['asignado']) }}</span>
    </ng-template>
  </ph-data-table-column>
  <ph-data-table-column name="consumido" header="Consumido" align="right">
    <ng-template #cell let-fila>
      <span>{{ intl.monto(fila['consumido']) }}</span>
    </ng-template>
  </ph-data-table-column>
  <ph-data-table-column name="desviacion" header="Desviacion" align="right">
    <ng-template #cell let-fila>
      <span [class.negativa]="fila['desviacion'] > 0" [class.positiva]="fila['desviacion'] < 0">
        {{ intl.monto(fila['desviacion']) }}
      </span>
    </ng-template>
  </ph-data-table-column>
</ph-data-table>
